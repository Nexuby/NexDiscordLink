# NexDiscordLink Configuration File

bot-token: "YOUR_BOT_TOKEN_HERE" # Replace with your Discord Bot Token

settings:
  language: "en" # Options: en, tr
  update-checker: true

database-settings:
  type: "sqlite" # Options: sqlite, mysql
  host: "localhost"
  port: 3306
  database: "nexdiscordlink"
  username: "root"
  password: ""

channels:
  log-channel-id: "123456789012345678"
  console-channel-id: "" # Optional fallback when console-webhook-url is empty
  console-webhook-url: "" # Optional: Use Webhook for console logs (Faster & Works during startup)

audit-log:
  enabled: true
  channel-id: "" # Empty uses channels.log-channel-id
  console: false

rewards:
  salary-interval: 60 # In minutes
  commands:
    - "eco give {player} 1000"
  boost-commands:
    - "eco give {player} 5000"
    - "give {player} diamond 5"
  link-rewards:
    enabled: true
    limit: 1 # How many times a player can receive link rewards (0 = unlimited)
    commands:
      - "eco give {player} 2000"
      - "give {player} golden_apple 2"
    first-link-commands:
      - "experience add {player} 250 points"
    relink-commands: []
    discord-role-commands:
      "YOUR_SUPPORTER_ROLE_ID":
        - "eco give {player} 1000"
    preview:
      - "&8&m--------------------------------"
      - "&b&lDiscord Eşleme Ödülleri"
      - "&7• &f2.000 oyun parası"
      - "&7• &f2 altın elma"
      - "&7• &fİlk eşlemede 250 XP"
      - "&8&m--------------------------------"

link-system:
  type: "BOTH" # Options: DM, MODAL, BOTH
  account-policy: "ONE_TO_ONE" # One Minecraft account per Discord account and vice versa
  modal:
    channel-id: "YOUR_LINK_CHANNEL_ID"
    button-label: "Link Account"
    button-style: "PRIMARY" # PRIMARY (blue), SECONDARY (grey), SUCCESS (green), DANGER (red)
    modal-title: "Link Your Account"
    input-label: "Link Code"
    input-placeholder: "Enter your 4-digit code"

unlink-security:
  require-confirmation: true # Uses 2FA when enabled, otherwise sends a Discord DM approval

security-settings:
  enabled: true

console-command:
  enabled: false # Enable /console slash command on Discord (DANGEROUS - allows full server access!)
  # Only root commands listed here can be executed. An empty list denies every command.
  whitelist:
    - "say"
    - "list"
    - "tps"

sync:
  nickname:
    enabled: true
    format: "%name%"
  ban:
    enabled: false
  linked-role:
    enabled: true
    role-id: "YOUR_LINKED_ROLE_ID"
  role-sync:
    enabled: true
    direction: "MINECRAFT_TO_DISCORD" # MINECRAFT_TO_DISCORD, DISCORD_TO_MINECRAFT, BIDIRECTIONAL
    interval-minutes: 5
    vault-groups:
      vip: "123456789012345678"
      mvp: "123456789012345678"

chat-bridge:
  enabled: true
  channel-id: "YOUR_CHAT_CHANNEL_ID"
  webhook-url: "" # Optional: If set, uses webhook for Game -> Discord (Better visuals)
  discord-to-game-format: "&8[&bDiscord&8] &f{user}: &7{message}"
