name: NexDiscordLink
version: ${version}
main: net.nex.discordlink.NexDiscordLink
api-version: 1.16
authors: [Nexuby]
description: A comprehensive Discord-Minecraft bridging plugin.
softdepend: [Vault]
commands:
  nexdiscord:
    description: Main command for NexDiscordLink
    usage: /nexdiscord <subcommand>
  link:
    description: Link your Discord account
    usage: /link
  unlink:
    description: Unlink your Discord account
    usage: /unlink
  2fa:
    description: Manage 2FA settings
    usage: /2fa <setup|verify|disable>
