name: NexDiscordLink
version: ${version}
main: net.nex.discordlink.NexDiscordLink
api-version: 1.16
authors: [Nexuby]
description: A comprehensive Discord-Minecraft bridging plugin.
softdepend: [Vault]
commands:
  nexdiscord:
    description: Main command for NexDiscordLink
    usage: /nexdiscord <subcommand>
  link:
    description: Link your Discord account
    usage: /link
  unlink:
    description: Unlink your Discord account
    usage: /unlink
  2fa:
    description: Manage 2FA settings
    usage: /2fa <setup|verify|disable>
permissions:
  nexdiscord.link:
    description: Allows players to link their Minecraft and Discord accounts
    default: true
  nexdiscord.unlink:
    description: Allows players to unlink their Discord account
    default: true
  nexdiscord.2fa:
    description: Allows players to manage two-factor authentication
    default: true
  nexdiscord.reload:
    description: Allows reloading NexDiscordLink configuration
    default: op
  nexdiscord.admin:
    description: Allows administrative NexDiscordLink commands
    default: op
    children:
      nexdiscord.reload: true
      nexdiscord.update.notify: true
  nexdiscord.update.notify:
    description: Notifies administrators about available updates
    default: op
